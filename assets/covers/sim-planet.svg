<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Sim Planet cover</title>
  <desc id="desc">A stylized star system with orbital structures and a highlighted planet.</desc>
  <defs>
