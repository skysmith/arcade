<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Train Panic</title>
    <script type="module" crossorigin src="./assets/index-B-EQaBxl.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BLkKZLer.css">
  </head>
  <body>
    <div id="app">
      <div id="hud" class="hud">
        <div class="hud__row">
          <div class="hud__card">
            <span class="hud__label">Score</span>
            <strong id="score-value">0</strong>
          </div>
          <div class="hud__card">
            <span class="hud__label">Stability</span>
            <strong id="stability-value">8</strong>
          </div>
          <div class="hud__card">
            <span class="hud__label">Rush</span>
            <strong id="rush-value">1</strong>
          </div>
        </div>
        <div class="hud__row">
          <div class="hud__wide">
            <span class="hud__label">Network</span>
            <span id="network-status">Boot the yard and keep the toy trains moving.</span>
          </div>
        </div>
        <div class="hud__row">
          <div class="hud__wide">
            <span class="hud__label">Crew</span>
            <span id="crew-status">Keyboard crew online. Gamepads can hot-join with A / Start.</span>
          </div>
        </div>
      </div>
    </div>
    <script defer src="../../shared/arcade-home.js" data-arcade-href="../../index.html"></script>
  </body>
</html>
