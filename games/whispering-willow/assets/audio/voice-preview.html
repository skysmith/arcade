<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whispering Willow Voice Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11171c;
        --panel: #17222a;
        --line: #30424b;
        --text: #eef6ec;
        --muted: #a8b7bc;
        --accent: #9de7c2;
        --gold: #e8c96e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      header {
        display: grid;
        gap: 10px;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 3vw, 2.6rem);
        letter-spacing: 0;
      }

      .meta {
        color: var(--muted);
        line-height: 1.5;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 0 0 18px;
      }

      input,
      select {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0d1318;
        color: var(--text);
        padding: 0 12px;
        font: inherit;
      }

      input {
        flex: 1 1 260px;
      }

      select {
        flex: 0 0 190px;
      }

      .clip-list {
        display: grid;
        gap: 10px;
      }

      .clip {
        display: grid;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 14px;
      }

      .clip-top {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px 14px;
      }

      .clip-title {
        margin: 0;
        color: var(--accent);
        font-size: 1rem;
        letter-spacing: 0;
      }

      .clip-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        color: #0e1518;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .tag {
        border-radius: 999px;
        background: var(--gold);
        padding: 3px 8px;
      }

      .copy {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
      }

      audio {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Whispering Willow Voice Preview</h1>
        <div id="summary" class="meta">Loading voice manifest...</div>
      </header>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search line, character, voice, or clip id" />
        <select id="group">
          <option value="all">All clips</option>
          <option value="campaign">Campaign auditions</option>
          <option value="mystery">Mystery clips</option>
          <option value="thread">Thread clips</option>
        </select>
      </div>
      <section id="clips" class="clip-list" aria-live="polite"></section>
    </main>
    <script type="module">
      const summary = document.querySelector("#summary");
      const list = document.querySelector("#clips");
      const search = document.querySelector("#search");
      const group = document.querySelector("#group");

      const manifest = await fetch("./voice-manifest.json", { cache: "no-store" }).then((response) => response.json());
      const clips = Object.entries(manifest.clips || {}).map(([id, clip]) => ({ id, ...clip }));

      function priority(id) {
        if (id.startsWith("campaign.")) return 0;
        if (id.includes(".mystery-")) return 1;
        return 2;
      }

      function clipMatchesGroup(clip, selected) {
        if (selected === "all") return true;
        if (selected === "campaign") return clip.id.startsWith("campaign.");
        if (selected === "mystery") return clip.id.includes(".mystery-");
        if (selected === "thread") return clip.id.startsWith("thread.") && !clip.id.includes(".mystery-");
        return true;
      }

      function render() {
        const needle = search.value.trim().toLowerCase();
        const selected = group.value;
        const filtered = clips
          .filter((clip) => clipMatchesGroup(clip, selected))
          .filter((clip) => {
            if (!needle) return true;
            return [clip.id, clip.characterName, clip.voice, clip.text].some((value) => String(value || "").toLowerCase().includes(needle));
          })
          .sort((a, b) => priority(a.id) - priority(b.id) || (a.characterName || "").localeCompare(b.characterName || "") || a.id.localeCompare(b.id));

        summary.textContent = `${filtered.length} of ${clips.length} clips shown. Generated ${new Date(manifest.generatedAt).toLocaleString()}.`;
        list.replaceChildren(...filtered.map((clip) => {
          const article = document.createElement("article");
          article.className = "clip";
          const audioSrc = new URL(clip.file, window.location.href).href;
          article.innerHTML = `
            <div class="clip-top">
              <h2 class="clip-title">${escapeHtml(clip.characterName || clip.characterId || clip.id)}</h2>
              <div class="clip-tags">
                <span class="tag">${escapeHtml(clip.voice || "voice")}</span>
                <span class="tag">${escapeHtml(clip.id.startsWith("campaign.") ? "campaign" : clip.id.includes(".mystery-") ? "mystery" : "thread")}</span>
              </div>
            </div>
            <p class="copy">${escapeHtml(clip.text || "")}</p>
            <audio controls preload="none" src="${audioSrc}"></audio>
          `;
          return article;
        }));
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        }[char]));
      }

      search.addEventListener("input", render);
      group.addEventListener("change", render);
      render();
    </script>
  </body>
</html>
