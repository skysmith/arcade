<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Donkey Kong Jr.</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div class="hud-rail" aria-label="Game status">
        <div class="pill">
          <span class="pill-label">Stage</span>
          <span id="stage-value">Vines</span>
        </div>
        <div class="pill">
          <span class="pill-label">Players</span>
          <span id="players-value">1</span>
        </div>
        <div class="pill">
          <span class="pill-label">Locks</span>
          <span id="locks-value">0 / 3</span>
        </div>
        <div class="pill pill--wide">
          <span class="pill-label">Status</span>
          <span id="status-value">Keyboard fallback ready.</span>
        </div>
      </div>

      <main id="playfield-shell" class="playfield-shell arcade-stage-shell">
        <div id="playfield-stage" class="playfield-stage arcade-stage">
          <canvas id="game" class="arcade-stage-canvas" width="960" height="720" aria-label="Donkey Kong Jr. style vine playfield"></canvas>
        </div>
      </main>

      <div class="footer-rail">
        <span id="hint-value">Climb the vines, grab keys, and break the chains. First pad becomes P1. Extra pads join live with Start.</span>
      </div>
    </div>

    <script type="module" src="./game.js"></script>
    <script defer src="../../shared/arcade-home.js" data-arcade-href="../../index.html"></script>
  </body>
</html>
